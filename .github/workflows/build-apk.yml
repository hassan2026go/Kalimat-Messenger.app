name: Build Kalimat Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Validate application files
        run: |
          set -e
          test -s index.html
          test -s app.js
          test -s firebase-config.js
          test -s manifest.json
          test -s sw.js
          test -s icon-192.png
          test -s icon-512.png
          test -s icon-maskable-512.png
          test -s icon.svg
          test -s scripts/generate-icons.mjs
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
          node --input-type=module --check < app.js
          node --check sw.js
          node --test tests/*.test.mjs
          node -e "
          const fs = require('fs');
          const sw = fs.readFileSync('sw.js', 'utf8');
          if (!sw.includes('requested.origin === self.location.origin')) {
            throw new Error('Notification clicks must be restricted to the app origin');
          }
          if (!sw.includes('res && res.ok')) {
            throw new Error('Service worker should cache only successful HTTP responses');
          }
          console.log('Service-worker origin and cache safety guards validated.');
          "
          node -e "
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          if (!html.includes('app.js') || !html.includes('manifest.json')) {
            throw new Error('index.html must load app.js and reference manifest.json');
          }
          for (const icon of manifest.icons || []) {
            if (!fs.existsSync(icon.src)) throw new Error('Missing manifest icon: ' + icon.src);
          }
          for (const [file, expected] of [['icon-192.png', 192], ['icon-512.png', 512], ['icon-maskable-512.png', 512]]) {
            const b = fs.readFileSync(file);
            if (b.toString('hex', 0, 8) !== '89504e470d0a1a0a') throw new Error(file + ' is not a PNG');
            const w = b.readUInt32BE(16), h = b.readUInt32BE(20);
            if (w !== expected || h !== expected) throw new Error(file + ' must be ' + expected + 'x' + expected + ', got ' + w + 'x' + h);
          }
          console.log('HTML references, manifest icons, PNG formats/dimensions, app.js, and sw.js validated.');
          "
          echo "Application smoke checks passed."

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Generate clean launcher artwork
        run: |
          npm install --no-save --no-audit --no-fund sharp
          node scripts/generate-icons.mjs
          cp generated-icons/icon-192.png icon-192.png
          cp generated-icons/icon-512.png icon-512.png
          cp generated-icons/icon-maskable-512.png icon-maskable-512.png

      - name: Prepare Capacitor project
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          cat > package.json <<'EOF'
          {
            "name": "kalimat",
            "version": "1.0.0",
            "private": true,
            "description": "Kalimat Android App"
          }
          EOF

          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/android@6
          npm install --no-audit --no-fund --save-dev @capacitor/cli@6 @capacitor/assets

          mkdir -p www assets

          cp index.html app.js firebase-config.js manifest.json sw.js www/
          cp icon-192.png icon-512.png icon-maskable-512.png www/
          cp icon.svg www/
          # Use the existing Kalimat feather artwork as the native Android launcher icon source.
          cp generated-icons/icon.png assets/icon.png
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.kalimat.messenger",
            "appName": "Kalimat",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          npx cap add android
          npx capacitor-assets generate --android --assetPath assets

          # Native FCM setup is optional until the repository secret is configured.
          # The secret must contain the complete google-services.json downloaded from Firebase.
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            node -e "
              const fs = require('fs');
              const cfg = JSON.parse(fs.readFileSync('android/app/google-services.json', 'utf8'));
              const project = cfg.project_info || {};
              const app = (cfg.client || []).find(c => c.client_info?.android_client_info?.package_name === 'com.kalimat.messenger');
              if (project.project_id !== 'kalimat-2014' || !app) {
                throw new Error('GOOGLE_SERVICES_JSON must belong to Firebase project kalimat-2014 and package com.kalimat.messenger');
              }
            "
            npm install --no-audit --no-fund @capacitor/push-notifications@6 esbuild
            npx esbuild native-push-entry.js --bundle --format=esm --platform=browser --outfile=www/native-push.js
            npx cap sync android

            # Capacitor creates a fresh Android project on each build; configure Google Services here.
            node --input-type=module <<'NODE'
            import fs from 'node:fs';
            const gradle = 'android/build.gradle';
            let root = fs.readFileSync(gradle, 'utf8');
            if (!root.includes("com.google.gms:google-services")) {
              root += "\n\nbuildscript {\n    repositories { google(); mavenCentral() }\n    dependencies { classpath 'com.google.gms:google-services:4.4.2' }\n}\n";
              fs.writeFileSync(gradle, root);
            }
            const appGradle = 'android/app/build.gradle';
            let app = fs.readFileSync(appGradle, 'utf8');
            if (!app.includes("com.google.gms.google-services")) app += "\napply plugin: 'com.google.gms.google-services'\n";
            fs.writeFileSync(appGradle, app);
            NODE
          else
            echo "GOOGLE_SERVICES_JSON is not configured; building APK without native FCM configuration."
          fi

          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Kalimat-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
