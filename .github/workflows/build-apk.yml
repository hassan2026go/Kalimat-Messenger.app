name: Build Kalimat Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Validate application files
        run: |
          set -e
          test -s index.html
          test -s app.js
          test -s firebase-config.js
          test -s manifest.json
          test -s sw.js
          test -s icon-192.png
          test -s icon-512.png
          test -s icon-maskable-512.png
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
          node --input-type=module --check < app.js
          node --check sw.js
          node --test tests/*.test.mjs
          node -e "
          const fs = require('fs');
          const sw = fs.readFileSync('sw.js', 'utf8');
          if (!sw.includes('requested.origin === self.location.origin')) {
            throw new Error('Notification clicks must be restricted to the app origin');
          }
          if (!sw.includes('res && res.ok')) {
            throw new Error('Service worker should cache only successful HTTP responses');
          }
          console.log('Service-worker origin and cache safety guards validated.');
          "
          node -e "
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          if (!html.includes('app.js') || !html.includes('manifest.json')) {
            throw new Error('index.html must load app.js and reference manifest.json');
          }
          for (const icon of manifest.icons || []) {
            if (!fs.existsSync(icon.src)) throw new Error('Missing manifest icon: ' + icon.src);
          }
          for (const [file, expected] of [['icon-192.png', 192], ['icon-512.png', 512], ['icon-maskable-512.png', 512]]) {
            const b = fs.readFileSync(file);
            if (b.toString('hex', 0, 8) !== '89504e470d0a1a0a') throw new Error(file + ' is not a PNG');
            const w = b.readUInt32BE(16), h = b.readUInt32BE(20);
            if (w !== expected || h !== expected) throw new Error(file + ' must be ' + expected + 'x' + expected + ', got ' + w + 'x' + h);
          }
          console.log('HTML references, manifest icons, PNG formats/dimensions, app.js, and sw.js validated.');
          "
          echo "Application smoke checks passed."

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Capacitor project
        run: |
          cat > package.json <<'EOF'
          {
            "name": "kalimat",
            "version": "1.0.0",
            "private": true,
            "description": "Kalimat Android App"
          }
          EOF

          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/android@6
          npm install --no-audit --no-fund --save-dev @capacitor/cli@6 @capacitor/assets

          mkdir -p www assets

          cp index.html app.js firebase-config.js manifest.json sw.js www/
          cp icon-192.png icon-512.png icon-maskable-512.png www/
          # Use the existing Kalimat feather artwork as the native Android launcher icon source.
          cp icon-512.png assets/icon.png
          npx capacitor-assets generate --android --assetPath assets

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.kalimat.messenger",
            "appName": "Kalimat",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Kalimat-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
